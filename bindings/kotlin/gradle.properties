# Increase heap for KMP builds
org.gradle.jvmargs=-Xmx8g

# Enable modern Gradle features
org.gradle.configuration-cache=true
org.gradle.caching=true

# Kotlin settings
kotlin.code.style=official
kotlin.mpp.stability.nowarn=true
# Only macOS builds the iOS targets.
kotlin.native.ignoreDisabledTargets=true
# iosMain (shared by the two iOS targets) uses the cinterop API of the bridge.
kotlin.mpp.enableCInteropCommonization=true
# No iOS klibs on other hosts: the cinterop needs macOS anyway. This also stops a warning on Linux and Windows.
kotlin.native.enableKlibsCrossCompilation=false
