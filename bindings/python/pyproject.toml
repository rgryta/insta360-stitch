[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "insta360-stitch"
version = "0.1.0"
description = "Stitch Insta360 dual-fisheye photos and videos into equirectangular panoramas"
readme = "../../README.md"
license = { text = "MIT OR Apache-2.0" }
requires-python = ">=3.9"
classifiers = [
  "Programming Language :: Rust",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/rgryta/insta360-stitch"

[dependency-groups]
dev = ["pytest>=8"]

[tool.maturin]
module-name = "insta360_stitch"
features = ["pyo3/extension-module"]

[tool.uv]
# rebuild the extension when the Rust sources change
cache-keys = [
  { file = "pyproject.toml" },
  { file = "Cargo.toml" },
  { file = "src/**/*.rs" },
  { file = "../../crates/insta360-stitch/src/**/*.rs" },
]
