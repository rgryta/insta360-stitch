[package]
name = "insta360-stitch-cli"
description = "A command-line tool that stitches Insta360 dual-fisheye photos and videos"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["insta360", "360", "panorama", "equirectangular", "cli"]
categories = ["command-line-utilities", "multimedia::images", "multimedia::video"]

[[bin]]
name = "insta360-stitch"
path = "src/main.rs"

[dependencies]
insta360-stitch.workspace = true
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = ["jpeg"] } # Decode only
serde_json = "1"
jpeg-encoder = "0.7"
rayon = "1"
