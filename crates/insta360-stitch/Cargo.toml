[package]
name = "insta360-stitch"
description = "Stitches Insta360 dual-fisheye photos and videos into equirectangular panoramas"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["parallel"]
# The rows are independent. This feature uses all processor cores for them.
parallel = ["dep:rayon"]

[dependencies]
rayon = { version = "1", optional = true }
