name: Kotlin

on:
  # Pull requests that change the Kotlin bindings, or the Rust workspace that the bridge builds from. A core change
  # that breaks the bridge also fails `cargo clippy --workspace` in ci.yml.
  pull_request:
    branches: [main]
    paths:
      - "bindings/kotlin/**"
      - "Cargo.toml"
      - "Cargo.lock"
      # The Kotlin tests embed this fixture, and the release runs this check of the jar.
      - "tests/fixtures/**"
      - "scripts/VerifyJvm.java"
      - ".github/workflows/kotlin.yml"
  workflow_dispatch:

# A new push to a pull request stops the run of the old push.
concurrency:
  group: kotlin-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jvm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/kotlin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew jvmTest

  # The common tests in an Android 16 emulator. Only on a manual start: an emulator run takes approximately 10 minutes.
  android:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v6
      - uses: android-actions/setup-android@v4
        with:
          packages: platforms;android-37.0 ndk;30.0.16248370
      - name: cargo-ndk
        run: cargo install --locked cargo-ndk@4.1.2
      # The emulator needs KVM.
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/30.0.16248370
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          working-directory: bindings/kotlin
          script: ./gradlew connectedAndroidDeviceTest
