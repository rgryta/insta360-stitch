# This workflow builds each package for each platform, then runs the built files on their platforms.
# It does not publish the packages and it does not make a GitHub release. It runs only when a person starts it manually.
name: Package builds

on:
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, node: linux-x64-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, node: linux-arm64-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # On Linux, zig links against glibc 2.17. Thus, the binaries also run on older distributions, for example Debian.
      # A download, because the setup-zig action still uses Node.js 20.
      - name: zig
        if: runner.os == 'Linux'
        run: |
          zig=zig-linux-$(uname -m)-0.13.0
          curl -sSfL --retry 5 "https://ziglang.org/download/0.13.0/$zig.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
      - name: CLI
        if: runner.os != 'Linux'
        run: cargo build --release -p insta360-stitch-cli --target ${{ matrix.target }}
      - name: CLI (Linux, glibc 2.17)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild && cargo zigbuild --release -p insta360-stitch-cli --target ${{ matrix.target }}.2.17
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/insta360-stitch
            target/${{ matrix.target }}/release/insta360-stitch.exe
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Node addon
        if: runner.os != 'Linux'
        working-directory: bindings/node
        run: npm ci && npx napi build --platform --release --target ${{ matrix.target }}
      # The zig linker of napi refuses a linker argument that rustc gives for aarch64 Linux. cargo-zigbuild accepts it.
      - name: Node addon (Linux, glibc 2.17)
        if: runner.os == 'Linux'
        run: |
          cargo zigbuild --release -p insta360-stitch-node --target ${{ matrix.target }}.2.17
          cp target/${{ matrix.target }}/release/libinsta360_stitch_node.so bindings/node/insta360-stitch.${{ matrix.node }}.node
      - uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node

  # Makes the npm packages: the main package and one package for each platform. It does not publish them.
  npm-packages:
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
        working-directory: bindings/node
      - uses: actions/download-artifact@v8
        with:
          pattern: node-*
          path: node-artifacts
      - run: bash scripts/pack-npm.sh node-artifacts npm-packages
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm-packages/*.tgz

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: universal2-apple-darwin, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*.whl

  # The abi3 wheels do not work on free-threaded Python. These jobs build a separate wheel for Python 3.14t.
  wheels-free-threaded-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i python3.14t
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-ft-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*.whl

  wheels-free-threaded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - id: python
        shell: bash
        run: |
          uv python install 3.14t
          echo "path=$(uv python find 3.14t)" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ steps.python.outputs.path }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-ft-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  # Runs the built files, not the source code: the CLI, the npm packages and each wheel, on its platform.
  # On Linux, the checks run in Debian bullseye (glibc 2.31) and Alpine (musl).
  verify:
    needs: [native, npm-packages, wheels, wheels-free-threaded-linux, wheels-free-threaded]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin, node-arch: arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, node-arch: x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Rosetta 2
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@v7
        if: runner.os != 'Linux'
        with:
          node-version: 20
          architecture: ${{ matrix.node-arch }}
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Check the builds
        shell: bash
        run: bash scripts/verify-build.sh ${{ matrix.target }} artifacts
