name: CI

on:
  # Pull requests to main. A merge is a fast-forward push of the tested pull request. Thus, main does not run CI
  # again. A pull request from a fork runs only after the maintainer approves the run (repository setting:
  # Actions > General > "Require approval for all external contributors").
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md", "docs/**"]
  # A manual start runs the full matrix, for example on main after a change to Cargo.lock or the toolchain. Thus,
  # main has caches that all pull requests can restore.
  workflow_dispatch:

# A new push to a pull request stops the run of the old push.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
        if: runner.os == 'Linux'
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p insta360-stitch -p insta360-stitch-cli --locked

  msrv:
    # The core and the CLI declare rust-version. This job makes sure that they build with it.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check -p insta360-stitch -p insta360-stitch-cli --locked

  node:
    strategy:
      matrix:
        # Pull requests test the bindings on Linux only. A manual start, or the repository variable
        # PR_FULL_MATRIX = true, gives all four systems. Before a publish, release.yml tests each package on its
        # platform.
        os: &bindings-os ${{ (github.event_name == 'workflow_dispatch' || vars.PR_FULL_MATRIX == 'true') && fromJSON('["ubuntu-latest","macos-latest","windows-latest","windows-11-arm"]') || fromJSON('["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/node
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run build
      - run: npm test

  python:
    strategy:
      matrix:
        os: *bindings-os
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: bindings/python
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v10.3.2
      - run: uv run --python 3.12 pytest -q
      # Python 3.14t has no GIL. The module must not turn the GIL on again when Python imports it.
      - run: uv run --python 3.14t pytest -q
      - run: uv run --python 3.14t python -c "import sys, insta360_stitch; assert not sys._is_gil_enabled(), 'the GIL is on'"
