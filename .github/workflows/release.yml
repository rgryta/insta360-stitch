# This workflow builds each package for each platform, then runs the built files on their platforms.
# A push of a version tag (for example v0.0.1-rc.1) then publishes them: PyPI, npm and a GitHub release.
# A manual start only builds and checks. It does not publish.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The tag must agree with the versions in the package files. Otherwise the publish jobs do not start.
  check-version:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Compare the tag with the package versions
        run: |
          version=${GITHUB_REF_NAME#v}
          # PEP 440 writes 0.0.1-rc.1 as 0.0.1rc1.
          pep440=$(echo "$version" | sed -E 's/-(a|b|rc)\.?([0-9]+)$/\1\2/')
          fail=0
          check() { [ "$2" = "$3" ] || { echo "::error::$1 has version $2, the tag needs $3"; fail=1; }; }
          check Cargo.toml "$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)" "$version"
          check bindings/python/pyproject.toml "$(grep -m1 '^version' bindings/python/pyproject.toml | cut -d'"' -f2)" "$pep440"
          for f in bindings/node/package.json bindings/node/npm/*/package.json; do
            check "$f" "$(node -p "require('./$f').version")" "$version"
          done
          exit $fail

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, node: linux-x64-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, node: linux-arm64-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # On Linux, zig links against glibc 2.17. Thus, the binaries also run on older distributions, for example Debian.
      # A download, because the setup-zig action still uses Node.js 20.
      - name: zig
        if: runner.os == 'Linux'
        run: |
          zig=zig-linux-$(uname -m)-0.13.0
          curl -sSfL --retry 5 "https://ziglang.org/download/0.13.0/$zig.tar.xz" | tar -xJ -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/$zig" >> "$GITHUB_PATH"
      - name: CLI
        if: runner.os != 'Linux'
        run: cargo build --release -p insta360-stitch-cli --target ${{ matrix.target }}
      - name: CLI (Linux, glibc 2.17)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild && cargo zigbuild --release -p insta360-stitch-cli --target ${{ matrix.target }}.2.17
      - uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/insta360-stitch
            target/${{ matrix.target }}/release/insta360-stitch.exe
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Node addon
        if: runner.os != 'Linux'
        working-directory: bindings/node
        run: npm ci && npx napi build --platform --release --target ${{ matrix.target }}
      # The zig linker of napi refuses a linker argument that rustc gives for aarch64 Linux. cargo-zigbuild accepts it.
      - name: Node addon (Linux, glibc 2.17)
        if: runner.os == 'Linux'
        run: |
          cargo zigbuild --release -p insta360-stitch-node --target ${{ matrix.target }}.2.17
          cp target/${{ matrix.target }}/release/libinsta360_stitch_node.so bindings/node/insta360-stitch.${{ matrix.node }}.node
      - uses: actions/upload-artifact@v7
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node

  # Makes the npm packages: the main package and one package for each platform. It does not publish them.
  npm-packages:
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
        working-directory: bindings/node
      - uses: actions/download-artifact@v8
        with:
          pattern: node-*
          path: node-artifacts
      - run: bash scripts/pack-npm.sh node-artifacts npm-packages
      - uses: actions/upload-artifact@v7
        with:
          name: npm-packages
          path: npm-packages/*.tgz

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: universal2-apple-darwin, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*.whl

  # The abi3 wheels do not work on free-threaded Python. These jobs build a separate wheel for Python 3.14t.
  wheels-free-threaded-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i python3.14t
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-ft-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*.whl

  wheels-free-threaded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.2
      - id: python
        shell: bash
        run: |
          uv python install 3.14t
          echo "path=$(uv python find 3.14t)" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ steps.python.outputs.path }}
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-ft-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  # Runs the built files, not the source code: the CLI, the npm packages and each wheel, on its platform.
  # On Linux, the checks run in Debian bullseye (glibc 2.31) and Alpine (musl).
  verify:
    needs: [native, npm-packages, wheels, wheels-free-threaded-linux, wheels-free-threaded]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin, node-arch: arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, node-arch: x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Rosetta 2
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@v7
        if: runner.os != 'Linux'
        with:
          node-version: 20
          architecture: ${{ matrix.node-arch }}
      - uses: astral-sh/setup-uv@v10.3.2
      - name: Check the builds
        shell: bash
        run: bash scripts/verify-build.sh ${{ matrix.target }} artifacts

  publish-pypi:
    needs: [check-version, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing: PyPI accepts the GitHub token of this workflow (release.yml, environment release).
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # A second run after a partial failure skips the files that PyPI has.
          skip-existing: true

  publish-npm:
    needs: [check-version, verify]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      # Trusted publishing and provenance. npm uses NPM_TOKEN only while that secret exists (the first publish).
      id-token: write
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v8
        with:
          name: npm-packages
          path: npm-packages
      - name: Publish the platform packages, then the main package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm makes provenance only for a public repository. For a private one, the option is an error.
          PROVENANCE: ${{ github.event.repository.private && 'false' || 'true' }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # npm pack names @cradgear/insta360-stitch as cradgear-insta360-stitch-<version>.tgz.
          main=npm-packages/cradgear-insta360-stitch-$version.tgz
          [ -f "$main" ] || { echo "::error::no $main"; exit 1; }
          for tgz in $(ls npm-packages/*.tgz | grep -vxF "$main") "$main"; do
            name=$(tar -xOzf "$tgz" package/package.json | node -p "JSON.parse(require('fs').readFileSync(0)).name")
            # A second run after a partial failure skips the packages that npm has.
            if npm view "$name@$version" version >/dev/null 2>&1; then echo "$name@$version is on npm"; continue; fi
            # shortcut: each release becomes "latest", also a pre-release. Use --tag next for pre-releases after 1.0.
            # "./" is necessary: without it, npm reads "npm-packages/x.tgz" as a GitHub repository (user/repo).
            npm publish "./$tgz" --access public --tag latest --provenance="$PROVENANCE"
          done

  github-release:
    needs: [publish-pypi, publish-npm]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          path: cli
      - name: Make the release with the CLI for each platform
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir out
          for dir in cli/cli-*; do
            target=${dir#cli/cli-}
            name=insta360-stitch-$GITHUB_REF_NAME-$target
            if [ -f "$dir/insta360-stitch.exe" ]; then
              (cd "$dir" && zip -q "$OLDPWD/out/$name.zip" insta360-stitch.exe)
            else
              # The artifact upload does not keep the executable bit.
              chmod +x "$dir/insta360-stitch"
              tar -czf "out/$name.tar.gz" -C "$dir" insta360-stitch
            fi
          done
          prerelease=$([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease || true)
          gh release create "$GITHUB_REF_NAME" out/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
