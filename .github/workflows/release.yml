# This workflow builds each package for each platform, then runs the built files on their platforms.
# It does not publish the packages. It runs only when a person starts it manually.
name: Release builds

on:
  workflow_dispatch:

jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: x86_64-apple-darwin }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      # On Linux, zig links against glibc 2.17. Thus, the binaries also run on older distributions, for example Debian.
      - uses: mlugg/setup-zig@v1
        if: runner.os == 'Linux'
        with:
          version: 0.13.0
      - name: CLI
        if: runner.os != 'Linux'
        run: cargo build --release -p insta360-stitch-cli --target ${{ matrix.target }}
      - name: CLI (Linux, glibc 2.17)
        if: runner.os == 'Linux'
        run: cargo install --locked cargo-zigbuild && cargo zigbuild --release -p insta360-stitch-cli --target ${{ matrix.target }}.2.17
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/insta360-stitch
            target/${{ matrix.target }}/release/insta360-stitch.exe
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Node addon
        working-directory: bindings/node
        shell: bash
        run: |
          npm ci
          if [ "$RUNNER_OS" = Linux ]; then
            npx napi build --platform --release --target ${{ matrix.target }} --zig --zig-abi-suffix 2.17
          else
            npx napi build --platform --release --target ${{ matrix.target }}
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: node-${{ matrix.target }}
          path: bindings/node/*.node

  wheels:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-latest, target: universal2-apple-darwin, manylinux: auto }
          - { os: windows-latest, target: x64, manylinux: auto }
          - { os: windows-11-arm, target: aarch64, manylinux: auto }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*.whl

  # The abi3 wheels do not work on free-threaded Python. These jobs build a separate wheel for Python 3.14t.
  wheels-free-threaded-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: auto }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: auto }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist -i python3.14t
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-ft-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux }}
          path: bindings/python/dist/*.whl

  wheels-free-threaded:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: universal2-apple-darwin }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - id: python
        shell: bash
        run: |
          uv python install 3.14t
          echo "path=$(uv python find 3.14t)" >> "$GITHUB_OUTPUT"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: bindings/python
          target: ${{ matrix.target }}
          args: --release --out dist -i ${{ steps.python.outputs.path }}
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-ft-${{ matrix.os }}-${{ matrix.target }}
          path: bindings/python/dist/*.whl

  # Runs the built files, not the source code: the CLI, the Node.js module and each wheel, on its platform.
  # On Linux, the checks run in Debian bullseye (glibc 2.31) and Alpine (musl).
  verify:
    needs: [native, wheels, wheels-free-threaded-linux, wheels-free-threaded]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin, node-arch: arm64 }
          - { os: macos-latest, target: x86_64-apple-darwin, node-arch: x64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-11-arm, target: aarch64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Rosetta 2
        if: matrix.target == 'x86_64-apple-darwin'
        run: softwareupdate --install-rosetta --agree-to-license
      - uses: actions/setup-node@v4
        if: runner.os != 'Linux'
        with:
          node-version: 20
          architecture: ${{ matrix.node-arch }}
      - uses: astral-sh/setup-uv@v5
      - name: Check the builds
        shell: bash
        run: bash scripts/verify-build.sh ${{ matrix.target }} artifacts
