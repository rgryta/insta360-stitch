[workspace]
resolver = "2"
members = ["crates/insta360-stitch", "crates/cli", "bindings/node", "bindings/python"]

[workspace.package]
version = "0.0.1-rc.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rgryta/insta360-stitch"

[workspace.dependencies]
insta360-stitch = { path = "crates/insta360-stitch" }

[profile.release]
lto = "thin"
codegen-units = 1
